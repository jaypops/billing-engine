[package]
name = "billing-engine-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }

sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

utoipa = { version = "6.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-scalar = { version = "0.4", features = ["axum"] }
utoipa-axum = "0.3.0"
