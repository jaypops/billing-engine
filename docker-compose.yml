services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing_dev_password
      POSTGRES_DB: billing_engine
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing_engine"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
